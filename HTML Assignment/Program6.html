<!--1.
 Image with Links
Create an HTML page where clicking on an image redirects the user to another website or page.
Use the <a> tag to wrap the <img> tag.
Add multiple linked images with different destinations.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore the world</title>
</head>
<body>
  <h1>Explore the websites</h1>
  <p>click on any image to explore the website</p>

  <a href="https://www.google.com/" target="_blank">
    <img src="images (2).jpg" alt="Google" width="300" height="300">
  </a>

  <a href="https://www.instagram.com/" target="_blank">
    <img src="images (3).jpg" alt="Instagram" width="300" height="300">
  </a>

  <a href="https://www.wikipedia.com/" target="_blank">
    <img src="images (4).jpg" alt="Wikipedia" width="300" height="300">
  </a>

</body>
</html>
