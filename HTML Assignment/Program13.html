<!--
2.
Scenario: A teacher wants to display a class's grades in a tabular format. The table should include:

Student ID
Name
Subject
Marks
Assignment: Create an HTML table with 5 rows of data. Add a heading row with proper column names.

-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Class's Grades</title>
  </head>
  <body>
    <table border="1">
      <caption>Class's Grades</caption>
      <thead>
        <tr>
          <th>Student ID</th>
          <th>Name</th>
          <th>Subject</th>
          <th>Marks</th>
        </tr>
      </thead>
      <tr>
            <td>101</td>
            <td>Rahul</td>
            <td>Mathematics</td>
            <td>85</td>
        </tr>
        <tr>
            <td>102</td>
            <td>Aman</td>
            <td>Science</td>
            <td>90</td>
        </tr>
        <tr>
            <td>103</td>
            <td>Priya</td>
            <td>English</td>
            <td>88</td>
        </tr>
        <tr>
            <td>104</td>
            <td>Neha</td>
            <td>Computer</td>
            <td>95</td>
        </tr>
        <tr>
            <td>105</td>
            <td>Vikas</td>
            <td>Hindi</td>
            <td>78</td>
        </tr>
    </table>

  </body>
</html>
